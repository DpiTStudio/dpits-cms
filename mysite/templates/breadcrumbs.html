<!-- ============================================
     ФАЙЛ: breadcrumbs.html
     ОПИСАНИЕ: Компонент хлебных крошек для навигации
     ============================================ -->

{% load static %}

{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="breadcrumbs py-2">
    <div class="container-fluid px-0">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'main:index' %}" class="text-white text-decoration-none opacity-75 hover-opacity-100">
                    <i class="fas fa-home me-1"></i>
                    <span>Главная</span>
                </a>
            </li>
            {% for crumb in breadcrumbs %}
            <li class="breadcrumb-item {% if forloop.last %}active text-white fw-bold{% else %}opacity-75{% endif %}">
                {% if not forloop.last %}
                <a href="{{ crumb.url }}" class="text-white text-decoration-none hover-opacity-100">
                    {% if crumb.icon %}<i class="{{ crumb.icon }} me-1"></i>{% endif %}
                    <span>{{ crumb.title }}</span>
                </a>
                {% else %}
                {% if crumb.icon %}<i class="{{ crumb.icon }} me-1"></i>{% endif %}
                <span>{{ crumb.title }}</span>
                {% endif %}
            </li>
            {% endfor %}
        </ol>
    </div>
</nav>


{% endif %}
