<style>
    /* Адаптивное меню с иконками */
.nav-responsive {
    gap: 0.25rem;
}

.nav-link-responsive {
    padding: 0.75rem 1rem !important;
    border-radius: 0.5rem;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    position: relative;
}

.nav-link-responsive:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
}

.nav-link-responsive.active {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(147, 51, 234, 0.15));
    border-left: 3px solid #3b82f6;
}

.nav-icon-wrapper {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
}

.nav-icon {
    font-size: 1.25rem;
    width: 24px;
    text-align: center;
    color: #a5b4fc;
    transition: all 0.3s ease;
}

.nav-link-responsive:hover .nav-icon,
.nav-link-responsive.active .nav-icon {
    color: #60a5fa;
    transform: scale(1.1);
}

.nav-text {
    font-weight: 500;
    transition: all 0.3s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.nav-indicator {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    transition: all 0.3s ease;
    transform: translateX(-50%);
    border-radius: 2px;
}

.nav-link-responsive.active .nav-indicator {
    width: 80%;
}

/* Адаптивность текста меню */
@media (max-width: 1199px) {
    .nav-text {
        max-width: 120px;
    }
}

@media (max-width: 991px) {
    .nav-responsive {
        gap: 0.5rem;
    }
    
    .nav-link-responsive {
        padding: 0.5rem !important;
        justify-content: center;
    }
    
    .nav-icon-wrapper {
        flex-direction: column;
        gap: 0.25rem;
        align-items: center;
    }
    
    .nav-icon {
        font-size: 1.5rem;
        width: 32px;
    }
    
    .nav-text {
        font-size: 0.75rem;
        text-align: center;
        max-width: 80px;
        line-height: 1.2;
    }
    
    .nav-link-responsive.active {
        border-left: none;
        border-bottom: 3px solid #3b82f6;
    }
    
    .nav-indicator {
        display: none;
    }
}

@media (min-width: 992px) {
    .nav-link-responsive.active .nav-indicator {
        width: 60%;
    }
}

@media (max-width: 768px) {
    .nav-responsive {
        width: 100%;
    }
    
    .nav-link-responsive {
        flex: 1;
        min-width: 0;
    }
    
    .nav-text {
        font-size: 0.7rem;
        max-width: 70px;
    }
}

/* Для очень маленьких экранов */
@media (max-width: 480px) {
    .nav-responsive {
        gap: 0.25rem;
    }
    
    .nav-text {
        font-size: 0.65rem;
        max-width: 60px;
    }
    
    .nav-icon {
        font-size: 1.25rem;
        width: 28px;
    }
}

/* Адаптивные кнопки аккаунта */
.btn-account {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 0.75rem;
    padding: 0.5rem 1rem;
    color: white;
    transition: all 0.3s ease;
}

.btn-account:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
}

.user-avatar-md {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
}

/* Адаптивные auth кнопки */
@media (max-width: 767px) {
    .auth-buttons {
        width: 100%;
    }
    
    .auth-buttons .btn {
        min-height: 44px;
        padding: 0.75rem;
    }
}
</style>
<!-- Мобильный поиск (виден только на мобильных в выпадающем меню) -->
<div class="d-md-none my-3 px-2">
    <form class="mobile-search-form" action="{% url 'news:search' %}" method="get">
        <div class="input-group">
            <input type="text" name="q" class="form-control bg-dark border-secondary text-white" placeholder="Поиск..." aria-label="Поиск">
            <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i></button>
        </div>
    </form>
</div>

<!-- Основное меню навигации -->
<ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center nav-responsive">
    <!-- Главная -->
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.app_name == 'main' %}active{% endif %}" href="{% url 'main:index' %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-home nav-icon"></i>
                <span class="nav-text">Главная</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    
    <!-- Новости -->
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.app_name == 'news' %}active{% endif %}" href="{% url 'news:list' %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-newspaper nav-icon"></i>
                <span class="nav-text">Новости</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    
    <!-- Услуги -->
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.app_name == 'services' %}active{% endif %}" href="{% url 'services:list' %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-concierge-bell nav-icon"></i>
                <span class="nav-text">Услуги</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    
    <!-- Портфолио -->
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.app_name == 'portfolio' %}active{% endif %}" href="{% url 'portfolio:list' %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-layer-group nav-icon"></i>
                <span class="nav-text">Портфолио</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    
    <!-- Отзывы -->
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.app_name == 'reviews' %}active{% endif %}" href="{% url 'reviews:list' %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-star nav-icon"></i>
                <span class="nav-text">Отзывы</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    
    <!-- Контакты -->
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.app_name == 'main' and request.resolver_match.url_name == 'contacts' %}active{% endif %}" href="{% url 'main:contacts' %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-phone nav-icon"></i>
                <span class="nav-text">Контакты</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    
    <!-- Динамические страницы -->
    {% for page in menu_pages %}
    <li class="nav-item">
        <a class="nav-link nav-link-responsive {% if request.resolver_match.kwargs.slug == page.slug %}active{% endif %}" href="{% url 'main:page_detail' page.slug %}">
            <div class="nav-icon-wrapper">
                <i class="fas fa-file-alt nav-icon"></i>
                <span class="nav-text">{{ page.title }}</span>
            </div>
            <span class="nav-indicator"></span>
        </a>
    </li>
    {% endfor %}
</ul>
