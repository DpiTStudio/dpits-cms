{% load static %}
<!-- ============================================
     ФАЙЛ: js.html
     ОПИСАНИЕ: Подключение всех JavaScript файлов проекта
     ВАЖНО: Скрипты загружаются в конце body для оптимизации загрузки страницы
     ============================================ -->

<!-- Подключение JavaScript библиотек -->

<!-- 1. Bootstrap 5 JavaScript bundle из CDN -->
<!-- Включает Popper.js для всплывающих элементов и все компоненты Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- HTMX Library (for dynamic interactions) -->
<script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

<!-- 2. Переключение темы -->
<!-- Функционал переключения между светлой и темной темой -->
<script src="{% static 'js/theme-toggle.js' %}"></script>

<!-- 3. Индикатор прогресса чтения -->
<!-- Отображение прогресса прокрутки страницы в верхней части экрана -->
<script src="{% static 'js/reading-progress.js' %}"></script>

<!-- 4. Социальный шаринг -->
<!-- Функционал для шаринга контента в социальных сетях -->
<script src="{% static 'js/social-share.js' %}"></script>

<!-- 5. Поиск -->
<!-- Функционал поиска по сайту с автодополнением -->
<script src="{% static 'js/search.js' %}"></script>

<!-- 6. Ленивая загрузка изображений -->
<!-- Оптимизация загрузки изображений при прокрутке страницы -->
<script src="{% static 'js/lazy-loading.js' %}"></script>

<!-- 7. Мобильные улучшения -->
<!-- Оптимизация интерфейса для мобильных устройств -->
<script src="{% static 'js/mobile-enhancements.js' %}"></script>

<!-- 7a. Выпадающее меню в шапке -->
<!-- Скрипт для управления поведением выпадающего меню при наведении -->
<script src="{% static 'js/header_menu_dropdown.js' %}"></script>

<!-- 8. Пользовательский JavaScript файл -->
<!-- Основной файл с кастомной логикой приложения -->
<script src="{% static 'js/main.js' %}"></script>

<!-- 9. Согласие с cookie -->
<script src="{% static 'js/cookie-consent.js' %}"></script>
