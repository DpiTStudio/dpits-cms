<!-- ============================================
     ФАЙЛ: featured_pages.html
     ОПИСАНИЕ: Секция рекомендуемых страниц 
     ============================================ -->

<!-- Блок рекомендуемых страниц (переопределяется в дочерних шаблонах) -->
{% block featured_pages %}
<!-- Условная проверка наличия рекомендуемых страниц -->
{% if featured_pages %}
<!-- Строка с вертикальными отступами -->
<div class="row py-5">
    <!-- Колонка на всю ширину -->
    <div class="col-12">
        <!-- Заголовок секции с выравниванием по левому краю и отступом снизу -->
        <h2 class="text-left mb-4">Наши страницы</h2>
        <!-- Строка для сетки карточек страниц -->
        <div class="row">
            <!-- Цикл по списку рекомендуемых страниц -->
            {% for page in featured_pages %}
            <!-- Колонка для карточки страницы - 4 колонки на средних экранах -->
            <div class="col-md-4 mb-4">
                <!-- Карточка с полной высотой и тенью -->
                <div class="card h-100 shadow-sm">
                    <!-- Тело карточки -->
                    <div class="card-body">
                        <!-- Заголовок страницы -->
                        <h5 class="card-title">{{ page.title }}</h5>
                        <!-- Текст страницы с удалением HTML тегов и ограничением количества слов -->
                        <p class="card-text">
                            {{ page.content|striptags|truncatewords:30 }}
                        </p>
                    </div>
                    <!-- Футер карточки с прозрачным фоном -->
                    <div class="card-footer bg-transparent">
                        <!-- Ссылка на детальную страницу -->
                        <a href="{{ page.get_absolute_url }}" class="btn btn-primary btn-sm">
                            Детали о проекте
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
