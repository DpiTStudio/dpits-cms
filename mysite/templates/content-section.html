<!-- Секция на всю ширину с классом для стилизации -->
<section class="content-section content-section-dark">
    <!-- Контейнер с полной шириной и адаптивными отступами -->
    <div class="container-fluid px-3 px-md-4 px-lg-5 py-4 py-md-5"> 
        <!-- Строка Bootstrap с отступами между колонками -->
        <div class="row g-4"> 
            <!-- Колонка на всю ширину -->
            <div class="col-12"> 
                <!-- Заголовок секции с жирным шрифтом и отступами -->
                <h2 class="fw-bold mb-4 mb-md-5 text-left text-md-start">Наши преимущества</h2> 
                <!-- Строка для карточек преимуществ с отступами между колонками -->
                <div class="row g-3 g-md-4"> 
                    <!-- Первая карточка преимущества - 12 колонок на маленьких экранах, 4 на средних -->
                    <div class="col-12 col-md-4 mb-3 mb-md-0">
                        <!-- Карточка с полной высотой, без границы, с эффектом тени при наведении и плавным переходом -->
                        <div class="card h-100 border-0 shadow-sm-hover transition-all"> 
                            <!-- Тело карточки с центрированием текста и адаптивными отступами -->
                            <div class="card-body text-center p-4 p-lg-5">
                                <!-- Иконка ракеты большого размера с основным цветом и отступом снизу -->
                                <i class="fas fa-rocket fa-3x text-primary mb-3"></i>
                                <!-- Заголовок карточки с полужирным шрифтом -->
                                <h5 class="card-title fw-semibold">Скорость</h5> 
                                <!-- Текст карточки с приглушенным цветом -->
                                <p class="card-text text-muted">Быстрая реализация проектов любой сложности</p> 
                            </div>
                        </div>
                    </div>
                    <!-- Вторая карточка преимущества - 12 колонок на маленьких экранах, 4 на средних -->
                    <div class="col-12 col-md-4 mb-3 mb-md-0">
                        <!-- Карточка с полной высотой, без границы, с эффектом тени при наведении и плавным переходом -->
                        <div class="card h-100 border-0 shadow-sm-hover transition-all">
                            <!-- Тело карточки с центрированием текста и адаптивными отступами -->
                            <div class="card-body text-center p-4 p-lg-5">
                                <!-- Иконка медали большого размера с основным цветом и отступом снизу -->
                                <i class="fas fa-medal fa-3x text-primary mb-3"></i>
                                <!-- Заголовок карточки с полужирным шрифтом -->
                                <h5 class="card-title fw-semibold">Качество</h5>
                                <!-- Текст карточки с приглушенным цветом -->
                                <p class="card-text text-muted">Высокое качество исполнения и внимание к деталям</p>
                            </div>
                        </div>
                    </div>
                    <!-- Третья карточка преимущества - 12 колонок на маленьких экранах, 4 на средних -->
                    <div class="col-12 col-md-4">
                        <!-- Карточка с полной высотой, без границы, с эффектом тени при наведении и плавным переходом -->
                        <div class="card h-100 border-0 shadow-sm-hover transition-all">
                            <!-- Тело карточки с центрированием текста и адаптивными отступами -->
                            <div class="card-body text-center p-4 p-lg-5">
                                <!-- Иконка гарнитуры большого размера с основным цветом и отступом снизу -->
                                <i class="fas fa-headset fa-3x text-primary mb-3"></i>
                                <!-- Заголовок карточки с полужирным шрифтом -->
                                <h5 class="card-title fw-semibold">Поддержка</h5>
                                <!-- Текст карточки с приглушенным цветом -->
                                <p class="card-text text-muted">Круглосуточная техническая поддержка</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
