{% comment %} Бейджи {% endcomment %}
<!-- Бейджи с тегами услуг -->
<div class="d-flex flex-wrap gap-2 mt-3">
    <span class="badge bg-light text-primary fs-6">Веб-разработка</span>
    <span class="badge bg-light text-primary fs-6">Дизайн</span>
    <span class="badge bg-light text-primary fs-6">E-commerce</span>
</div>
<hr>
<div class="d-flex flex-wrap gap-3">
    <a href="{% url 'portfolio:categories' %}" class="btn btn-light btn-lg">
        <i class="fas fa-layer-group me-2"></i>Все категории
    </a>
    <a href="{% url 'portfolio:create_order' %}" class="btn btn-outline-light btn-lg">
        <i class="fas fa-rocket me-2"></i>Начать проект
    </a>
</div>
<hr>
<div class="d-flex flex-wrap gap-3 align-items-center">
    <div class="d-flex align-items-center">
        <i class="far fa-calendar me-2"></i>
        <span>{{ item.project_date|date:"d.m.Y" }}</span>
    </div>
    <div class="d-flex align-items-center">
        <i class="far fa-eye me-2"></i>
        <span>{{ item.views }} просмотров</span>
    </div>
    {% if item.client %}
    <div class="d-flex align-items-center">
        <i class="fas fa-user me-2"></i>
        <span>Клиент: {{ item.client }}</span>
    </div>
    {% endif %}
</div>
