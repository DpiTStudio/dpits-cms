{% load static %}

{% if sidebar_news %}
<div class="card mb-4 shadow-sm border-0 rounded-4 overflow-hidden sidebar-news-card">
    <!-- Заголовок с улучшенным дизайном -->
    <div class="card-header border-0 pb-0 bg-transparent">
        <h6 class="mb-0 text-white opacity-75 text-uppercase fw-bold ls-1" style="font-size: 0.75rem; letter-spacing: 0.1em;">
            <i class="fas fa-newspaper me-2"></i> Последние новости
        </h6>
    </div>

    <!-- Тело карточки -->
    <div class="card-body p-3 bg-transparent">
        {% for news in sidebar_news %}
        <div class="news-sidebar-item" 
             style="background-image: url('{% if news.image %}{{ news.image.url }}{% else %}{% static 'images/default-news.jpg' %}{% endif %}');">
            <div class="news-sidebar-overlay"></div>
            <a href="{% url 'news:detail' news.slug %}" class="news-sidebar-link">
                <div class="news-sidebar-content">
                    <h6 class="news-sidebar-title">{{ news.title }}</h6>
                    <div class="news-sidebar-meta">
                        <i class="fas fa-calendar-alt"></i>
                        <span>{{ news.created_at|date:"d.m.Y" }}</span>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
        
        <!-- Кнопка "Все новости" -->
        <div class="text-center mt-3">
            <a href="{% url 'news:list' %}" 
               class="btn-sidebar-news">
                <span>Все новости</span>
                <i class="fas fa-arrow-right ms-2 fa-sm"></i>
            </a>
        </div>
    </div>
</div>


{% endif %}
