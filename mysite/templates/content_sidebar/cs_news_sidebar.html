{% load static %}

{% if sidebar_news %}
<div class="card mb-4 shadow-sm border-0 rounded-4 overflow-hidden">
    <!-- Заголовок с улучшенным дизайном -->
    <div class="card-header bg-primary text-white">
        <!-- Заголовок с иконкой -->
        <h6 class="mb-0">
            <i class="fas fa-newspaper fa-sm"></i> Последние новости
        </h6>
    </div>

    <!-- Тело карточки -->
    <div class="card-body p-3">
        {% for news in sidebar_news %}
        <div class="news-sidebar-item position-relative mb-3">
            <a href="{% url 'news:detail' news.slug %}" class="text-decoration-none text-dark d-block">
                <div class="row g-2 align-items-center">
                    <!-- Изображение сбоку -->
                    <div class="col-4">
                        <div class="position-relative overflow-hidden rounded-3" style="aspect-ratio: 1/1;">
                            {% if news.image %}
                            <img src="{{ news.image.url }}" 
                                 alt="{{ news.title }}"
                                 class="img-fluid w-100 h-100 object-fit-cover transition-scale">
                            {% else %}
                            <img src="{% static 'images/default-news.jpg' %}" 
                                 alt="{{ news.title }}"
                                 class="img-fluid w-100 h-100 object-fit-cover transition-scale">
                            {% endif %}
                        </div>
                    </div>
                    <!-- Контент -->
                    <div class="col-8">
                        <div class="d-flex flex-column justify-content-center h-100">
                            <!-- Заголовок -->
                            <h6 class="fw-semibold mb-1 lh-sm text-dark hover-text-primary transition-color" style="font-size: 0.85rem;">
                                {{ news.title|truncatechars:45 }}
                            </h6>
                            <!-- Дата -->
                            <div class="d-flex align-items-center text-muted mt-auto" style="font-size: 0.75rem;">
                                <i class="fas fa-calendar-alt me-1"></i>
                                <span>{{ news.created_at|date:"d.m.Y" }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
        
        <!-- Кнопка "Все новости" -->
        <div class="text-center mt-1 pt-1">
            <a href="{% url 'news:list' %}" 
               class="btn btn-primary px-4 py-2 rounded-pill fw-medium shadow-sm hover-lift">
                <span>Все новости</span>
                <i class="fas fa-arrow-right ms-2 fa-sm"></i>
            </a>
        </div>
    </div>
</div>


{% endif %}
