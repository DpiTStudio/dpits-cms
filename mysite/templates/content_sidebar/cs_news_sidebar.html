{% load static %}

{% if sidebar_news %}
<div class="card sidebar-premium-card">
    <div class="card-header sidebar-premium-header">
        <h6>
            <i class="fas fa-newspaper"></i> Последние новости
        </h6>
    </div>

    <div class="card-body sidebar-premium-body">
        {% for news in sidebar_news %}
        <a href="{% url 'news:detail' news.slug %}" class="sidebar-premium-item has-bg" style="animation-delay: {{ forloop.counter }}00ms;">
            <!-- Слой с фоновым изображением -->
            <div class="sidebar-premium-bg" 
                 style="background-image: url('{% if news.image %}{{ news.image.url }}{% else %}{% static 'images/default-news.jpg' %}{% endif %}');">
            </div>

            <!-- Иконка на фоне (декоративная) -->
            <div class="sidebar-premium-icon-bg">
                <i class="fas fa-newspaper"></i>
            </div>
            
            <!-- Оверлей для читаемости -->
            <div class="sidebar-premium-overlay"></div>
            
            <!-- Контент новости -->
            <div class="sidebar-premium-content">
                <h6 class="sidebar-premium-title">{{ news.title }}</h6>
                <div class="sidebar-premium-meta">
                    <i class="far fa-calendar-alt"></i>
                    <span>{{ news.created_at|date:"d.m.Y" }}</span>
                </div>
            </div>
        </a>
        {% endfor %}
        
        <!-- Кнопка "Все новости" -->
        <a href="{% url 'news:list' %}" class="btn-sidebar-premium">
            <span>Посмотреть всё</span>
            <i class="fas fa-chevron-right fa-xs"></i>
        </a>
    </div>
</div>
{% endif %}
