{% load static %}

{% if sidebar_news %}
<div class="card mb-4 shadow-sm border-0 sidebar-news-card overflow-hidden">
    <!-- Заголовок с улучшенным дизайном -->
    <div class="card-header border-0 pb-1 bg-transparent px-4 pt-4">
        <h6 class="mb-0 text-white opacity-90 text-uppercase fw-bold" style="font-size: 0.8rem; letter-spacing: 0.15em;">
            <i class="fas fa-bolt text-primary me-2"></i> Последние новости
        </h6>
    </div>

    <!-- Тело карточки -->
    <div class="card-body p-4 bg-transparent">
        {% for news in sidebar_news %}
        <div class="news-sidebar-item">
            <!-- Слой с фоновым изображением -->
            <div class="news-sidebar-bg" 
                 style="background-image: url('{% if news.image %}{{ news.image.url }}{% else %}{% static 'images/default-news.jpg' %}{% endif %}');">
            </div>
            
            <!-- Оверлей для читаемости -->
            <div class="news-sidebar-overlay"></div>
            
            <!-- Контент новости -->
            <a href="{% url 'news:detail' news.slug %}" class="news-sidebar-link">
                <div class="news-sidebar-content">
                    <h6 class="news-sidebar-title">{{ news.title }}</h6>
                    <div class="news-sidebar-meta">
                        <i class="far fa-calendar-alt"></i>
                        <span>{{ news.created_at|date:"d.m.Y" }}</span>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
        
        <!-- Кнопка "Все новости" -->
        <div class="text-center mt-2">
            <a href="{% url 'news:list' %}" 
               class="btn-sidebar-news shadow-sm">
                <span>Посмотреть всё</span>
                <i class="fas fa-chevron-right ms-2 fa-xs"></i>
            </a>
        </div>
    </div>
</div>


{% endif %}
