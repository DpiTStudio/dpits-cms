{% load static %}

{% if site_settings.phone1 or site_settings.email %}
<div class="card sidebar-premium-card">
    <div class="card-header sidebar-premium-header">
        <h6>
            <i class="fas fa-id-card"></i> Контакты
        </h6>
    </div>

    <div class="card-body sidebar-premium-body">
        <div class="sidebar-contact-info">
            {% if site_settings.phone1 %}
            <a href="tel:{{ site_settings.phone1 }}" class="sidebar-contact-link" style="animation-delay: 100ms;">
                <i class="fas fa-phone-alt"></i>
                <div class="flex-grow-1">
                    <small class="d-block opacity-50 uppercase fw-bold" style="font-size: 0.6rem; letter-spacing: 0.05em;">Телефон</small>
                    <span class="d-block fw-bold">{{ site_settings.phone1 }}</span>
                </div>
            </a>
            {% endif %}

            {% if site_settings.email %}
            <a href="mailto:{{ site_settings.email }}" class="sidebar-contact-link" style="animation-delay: 200ms;">
                <i class="fas fa-envelope"></i>
                <div class="flex-grow-1">
                    <small class="d-block opacity-50 uppercase fw-bold" style="font-size: 0.6rem; letter-spacing: 0.05em;">Email</small>
                    <span class="d-block fw-bold">{{ site_settings.email }}</span>
                </div>
            </a>
            {% endif %}
        </div>
        
        <!-- Кнопка "Связаться с нами" (опционально) -->
        <a href="{% url 'main:contact_form' %}" class="btn-sidebar-premium">
            <span>Написать нам</span>
            <i class="fas fa-paper-plane fa-xs"></i>
        </a>
    </div>
</div>
{% endif %}
