{% load static %}

{% if sidebar_reviews %}
<div class="card sidebar-premium-card">
    <div class="card-header sidebar-premium-header">
        <h6>
            <i class="fas fa-star"></i> Последние отзывы
        </h6>
    </div>

    <div class="card-body sidebar-premium-body">
        {% for review in sidebar_reviews %}
        <div class="sidebar-premium-item" style="animation-delay: {{ forloop.counter }}00ms;">
            <!-- Иконка на фоне (декоративная) -->
            <div class="sidebar-premium-icon-bg">
                <i class="fas fa-quote-right"></i>
            </div>
            
            <div class="sidebar-premium-content" style="min-height: auto;">
                <div class="sidebar-review-author">{{ review.full_name }}</div>
                <div class="sidebar-review-text">
                    "{{ review.message|truncatewords:12 }}"
                </div>
                <div class="sidebar-premium-meta">
                    <i class="fas fa-calendar-alt"></i>
                    <span>{{ review.created_at|date:"d.m.Y" }}</span>
                </div>
            </div>
        </div>
        {% endfor %}

        <!-- Кнопка "Оставить отзыв" (опционально, если есть урл) -->
        {% if reviews_url %}
        <a href="{{ reviews_url }}" class="btn-sidebar-premium">
            <span>Все отзывы</span>
            <i class="fas fa-comments fa-xs"></i>
        </a>
        {% endif %}
    </div>
</div>
{% endif %}
