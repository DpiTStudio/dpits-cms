{% load static %}

{% if sidebar_portfolio %}
<div class="card sidebar-premium-card">
    <div class="card-header sidebar-premium-header">
        <h6>
            <i class="fas fa-briefcase"></i> Последние работы
        </h6>
    </div>

    <div class="card-body sidebar-premium-body">
        {% for project in sidebar_portfolio %}
        <a href="{% url 'portfolio:detail' project.slug %}" class="sidebar-premium-item has-bg" style="animation-delay: {{ forloop.counter }}00ms;">
            <!-- Слой с фоновым изображением -->
            <div class="sidebar-premium-bg" 
                 style="background-image: url('{% if project.image %}{{ project.image.url }}{% else %}{% static 'images/default-portfolio.jpg' %}{% endif %}');">
            </div>

            <!-- Иконка на фоне (декоративная) -->
            <div class="sidebar-premium-icon-bg">
                <i class="fas fa-briefcase"></i>
            </div>
            
            <!-- Оверлей для читаемости -->
            <div class="sidebar-premium-overlay"></div>
            
            <!-- Контент работы -->
            <div class="sidebar-premium-content">
                <h6 class="sidebar-premium-title">{{ project.title|truncatewords:8 }}</h6>
                <div class="sidebar-premium-meta">
                    <i class="fas fa-calendar"></i>
                    <span>{{ project.created_at|date:"d.m.Y" }}</span>
                </div>
            </div>
        </a>
        {% endfor %}
        
        <!-- Кнопка "Все работы" -->
        <a href="{% url 'portfolio:list' %}" class="btn-sidebar-premium">
            <span>Все работы</span>
            <i class="fas fa-arrow-right fa-xs"></i>
        </a>
    </div>
</div>
{% endif %}
