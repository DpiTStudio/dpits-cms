<!-- Hero Section -->
<section class="hero-section bg-gradient-primary text-white py-4">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'portfolio:list' %}" class="text-white">Портфолио</a></li>
                <li class="breadcrumb-item"><a href="?category={{ item.category.slug }}" class="text-white">{{ item.category.name }}</a></li>
                <li class="breadcrumb-item active text-white" aria-current="page">{{ item.title }}</li>
            </ol>
        </nav>
        
        <div class="row align-items-center">
            <div class="col-lg-8">
                <span class="badge bg-light text-primary mb-2">{{ item.category.name }}</span>
                <h1 class="display-6 fw-bold mb-3">{{ item.title }}</h1>
                <p class="lead mb-4">{{ item.short_description }}</p>
                
                <div class="d-flex flex-wrap gap-3 align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="far fa-calendar me-2"></i>
                        <span>{{ item.project_date|date:"d.m.Y" }}</span>
                    </div>
                    <div class="d-flex align-items-center">
                        <i class="far fa-eye me-2"></i>
                        <span>{{ item.views }} просмотров</span>
                    </div>
                    {% if item.client %}
                    <div class="d-flex align-items-center">
                        <i class="fas fa-user me-2"></i>
                        <span>Клиент: {{ item.client }}</span>
                    </div>
                    {% endif %}
                </div>
            </div>
            <div class="col-lg-4 text-center">
                <img src="{{ item.image.url }}" alt="{{ item.title }}" class="img-fluid rounded shadow">
            </div>
        </div>
    </div>
</section>
