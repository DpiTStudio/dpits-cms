<!-- Hero Section -->
<section class="hero-section bg-primary text-white">
    <div class="container">
        <div class="row align-items-left">
            <div class="col-lg-5">
                <h1 class="display-5 fw-bold mb-3">Наше портфолио</h1>
                <h2 class="display-4 fw-bold mb-1">
                    {{ site_settings.logo_text|default:"Добро пожаловать" }}
                </h2>
                {% if site_settings.slogan %}
                <p class="lead mb-4">
                    {{ site_settings.slogan }}
                </p>
                {% endif %}
                {% if site_settings.motto %}
                <div class="motto-content">
                    {{ site_settings.motto|safe }}
                </div>
                {% endif %}
            </div>
            <div class="col-lg-2">
                {% if site_settings.logo %}
                <div class="text-left">
                    <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.logo_text }}" class="img_hero rounded shadow">
                </div>
                {% endif %}
            </div>
                <div class="d-flex flex-wrap gap-3">
                    <a href="{% url 'portfolio:categories' %}" class="btn btn-light btn-lg">
                        <i class="fas fa-layer-group me-2"></i>Все категории
                    </a>
                    <a href="{% url 'portfolio:create_order' %}" class="btn btn-outline-light btn-lg">
                        <i class="fas fa-rocket me-2"></i>Начать проект
                    </a>
                </div>
        </div>
    </div>
</section>
