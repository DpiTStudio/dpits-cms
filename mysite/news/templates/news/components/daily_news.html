<!-- Навигация по дню публикации (Лента событий) -->
{% load news_tags %}
{% if daily_news %}
<div class="card sidebar-premium-card mb-4 glass-container border-opacity-25">
  <!-- Заголовок -->
  <div class="card-header sidebar-premium-header-news bg-transparent border-secondary border-opacity-25 py-3">
    <div class="d-flex align-items-center justify-content-between">
      <h5 class="mb-0 text-white fw-bold">
        <i class="far fa-calendar-check text-primary me-2"></i>
        Лента за {{ daily_news_date|ru_date }}
      </h5>
      <span class="badge bg-primary bg-opacity-20 text-primary fs-6" style="vertical-align: middle">
        {{ daily_news|length }}
      </span>
    </div>
  </div>

  <!-- Список новостей дня -->
  <div class="card-body p-0 daily-news-scroll" style="max-height: 450px; overflow-y: auto">
    <div class="list-group list-group-flush bg-transparent">
      {% for d_news in daily_news %}
      <a
        href="{{ d_news.get_absolute_url }}"
        class="list-group-item list-group-item-action bg-transparent border-secondary border-opacity-10 py-3 px-4 transition-hover {% if d_news.id == news.id %}active-news-item{% endif %}"
      >
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="text-primary small fw-bold">
            <i class="far fa-clock me-1"></i>
            {{ d_news.published_at|ru_date:"time" }}
          </span>
          <div class="d-flex align-items-center gap-2">
            {% if d_news.id == news.id %}
            <span class="badge bg-success bg-opacity-75 rounded-pill small">Читаете</span>
            {% endif %}
            <span class="text-muted" style="font-size:0.75rem;">
              <i class="far fa-eye me-1"></i>{{ d_news.views }}
            </span>
          </div>
        </div>
        <h6 class="mb-0 text-white fw-semibold" style="font-size:0.87rem; line-height:1.35;">
          {{ d_news.title }}
        </h6>
      </a>
      {% endfor %}
    </div>
  </div>
</div>

<style>
  .active-news-item {
    background: rgba(var(--bs-primary-rgb), 0.05) !important;
    border-left: 3px solid var(--bs-primary) !important;
  }
  .transition-hover {
    transition: all 0.25s ease;
  }
  .transition-hover:hover {
    background: rgba(255, 255, 255, 0.025) !important;
    padding-left: 1.5rem !important;
  }
  .daily-news-scroll::-webkit-scrollbar { width: 5px; background: #0a0d1a; }
  .daily-news-scroll::-webkit-scrollbar-track { background: #0a0d1a; border-radius: 3px; }
  .daily-news-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  .daily-news-scroll::-webkit-scrollbar-thumb:hover { background: rgba(var(--bs-primary-rgb),0.5); }
</style>
{% endif %}
