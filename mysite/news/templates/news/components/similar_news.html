<!-- Похожие новости -->
{% load static %}

{% if similar_news %}
<div class="card sidebar-premium-card mb-4">
    <div class="card-header sidebar-premium-header-news">
        <h6>
            <i class="fas fa-layer-group"></i> Похожие новости
        </h6>
    </div>

    <div class="card-body sidebar-premium-body">
        {% for similar in similar_news %}
        <a href="{% url 'news:detail' similar.slug %}" class="sidebar-premium-item has-bg" style="animation-delay: {{ forloop.counter }}00ms;">
            <!-- Основное фоновое изображение -->
            <div class="sidebar-premium-bg" 
                 style="background-image: url('{% if similar.image %}{{ similar.image.url }}{% else %}{% static 'images/default-news.jpg' %}{% endif %}');">
            </div>

            <!-- Декоративная иконка на заднем плане -->
            <div class="sidebar-premium-icon-bg">
                <i class="fas fa-newspaper"></i>
            </div>
            
            <!-- Интеллектуальный градиентный оверлей для глубины -->
            <div class="sidebar-premium-overlay vibrant"></div>
            
            <!-- Контентная часть с эффектом матового стекла -->
            <div class="sidebar-premium-content glass-effect">
                <h6 class="sidebar-premium-title">{{ similar.title }}</h6>
                <div class="sidebar-premium-meta">
                    <i class="far fa-calendar-alt"></i>
                    <span>{{ similar.created_at|date:"d.m.Y" }}</span>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endif %}
