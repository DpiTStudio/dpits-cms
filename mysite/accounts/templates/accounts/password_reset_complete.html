<!-- accounts/templates/accounts/password_reset_complete.html -->
{% extends "_base.html" %}
{% load static %}

{% block title %}{{ site_settings.logo_text }} - Пароль изменён{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/profile_forms.css' %}">
{% endblock %}

{% block content %}
<section class="profile-form-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-xl-5">
                <div class="profile-form-card">
                    <div class="profile-form-header" style="text-align: center;">
                        <i class="fas fa-check-circle" style="font-size: 3rem; color: var(--success, #198754); margin-bottom: 1rem;"></i>
                        <h2>Пароль успешно изменён!</h2>
                        <p>Теперь вы можете войти в систему с новым паролем.</p>
                    </div>
                    <div class="profile-form-body" style="text-align: center;">
                        <a href="{% url 'accounts:login' %}" class="btn-submit-custom d-inline-flex align-items-center gap-2">
                            <i class="fas fa-sign-in-alt"></i> Войти в аккаунт
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
